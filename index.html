<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nepal 26 August Disaster Resolution Desk</title><style>*{box-sizing:border-box}body{font-family:system-ui,sans-serif;margin:0;background:#edf0f2;color:#17202a}header{background:#13202c;color:#fff;padding:16px}header .wrap,main{max-width:1150px;margin:auto}.headrow{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.lang{display:flex;gap:6px}.lang button{border:1px solid #82909d;background:#fff;color:#17202a;border-radius:5px;padding:9px 12px;font-weight:700}.lang button.active{background:#f0b323;border-color:#f0b323}h1{margin:0;font-size:24px}.sub{margin:4px 0 0;color:#d7dee5}.banner,.warn,.danger{margin:12px 0;padding:12px;border-left:5px solid}.banner{border-color:#006d9c;background:#e2f4fb}.warn{border-color:#a96b00;background:#fff2c6}.danger{border-color:#8b0000;background:#fdeaea}.controls{position:sticky;top:0;background:#fff;padding:10px;margin:12px 0;border-radius:8px;z-index:3;box-shadow:0 2px 8px #0001}.controls input,.controls select,.controls>button{width:100%;padding:11px;margin:3px 0;font-size:15px;border:1px solid #b7bec5;border-radius:5px}.controls>button{background:#17202a;color:#fff}.toggle{display:flex;gap:8px;align-items:center;padding:8px 2px}.toggle input{width:auto}.stats{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.stat{background:#fff;padding:9px 11px;border-radius:6px;font-weight:700}.card{background:#fff;margin:8px 0;padding:14px;border-radius:8px;border-left:5px solid #74808a}.MISSING{border-color:#a61b1b}.FOUND_SAFE,.RESCUED,.LOCATED{border-color:#22733f}.FOUND_INJURED{border-color:#b26a00}.FOUND_DEAD{border-color:#252525}.UNKNOWN{border-color:#7b4a8d}.UNIDENTIFIED_BODY{border-color:#111;background:#f7f7f7}.pill{font-size:11px;background:#eef1f3;border-radius:12px;padding:3px 7px;margin-right:4px;display:inline-block}.sourcepill{background:#e4f1fb;color:#005c9c;text-decoration:underline;font-weight:700}.source-link{display:inline-block;margin-top:6px;padding:8px 10px;border:1px solid #90b8d2;border-radius:5px;background:#f4fbff;font-weight:700;text-decoration:none}.meta{font-size:13px;color:#5c6670}.original{font-size:12px;color:#6b7278;margin-top:8px}.empty{display:none;background:#fff;padding:18px}.sourcebox{background:#fff;padding:12px;margin-top:18px;border-radius:8px}.sourcebox div{padding:10px 0;border-bottom:1px solid #eee}.sourcebox div:last-child{border:0}a{color:#005c9c}main{padding:0 12px 35px}.small{font-size:12px;color:#616a72}@media(max-width:640px){.headrow{display:block}.lang{margin-top:12px}.lang button{flex:1}}</style></head><body><header><div class="wrap"><div class="headrow"><div><h1 id="title"></h1><p class="sub" id="subtitle"></p></div><div class="lang"><button id="langEn" class="active">English</button><button id="langNe">नेपाली</button></div></div></div></header><main><div class="banner" id="scope"></div><div class="warn" id="evidence"></div><div class="controls"><input id="q"><select id="st"><option value=""></option><option value="MISSING">MISSING</option><option value="LOCATED">LOCATED</option><option value="FOUND_SAFE">FOUND_SAFE</option><option value="RESCUED">RESCUED</option><option value="FOUND_INJURED">FOUND_INJURED</option><option value="FOUND_DEAD">FOUND_DEAD</option><option value="UNKNOWN">UNKNOWN</option><option value="UNIDENTIFIED_BODY">UNIDENTIFIED_BODY</option></select><select id="district"><option value=""></option></select><select id="src"><option value=""></option></select><label class="toggle"><input type="checkbox" id="bodies"><span id="bodiesLabel"></span></label><button id="csv"></button></div><div id="bodyWarning" class="danger" style="display:none"></div><div class="stats" id="stats"></div><section id="records"></section><div id="empty" class="empty"></div><section class="sourcebox"><h2 id="coverageTitle"></h2><div id="coverage"></div></section><p class="small" id="architecture"></p></main><script>let people=[],bodies=[],coverage=[],rows=[],language='en';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const norm=s=>String(s||'').toLowerCase().normalize('NFKD').replace(/[^\p{L}\p{N}]+/gu,' ').trim();const T={en:{title:'Nepal 26 August Disaster Resolution Desk',subtitle:'National affected-person reconciliation · Bhote Koshi/Rasuwa origin zone and downstream/cross-district consequences',scope:'<b>National scope:</b> every available affected-person source record connected to the 26 Aug 2026 Nepal disaster, regardless of home district, recovery district, nationality or reporting authority. Rasuwa is an event/origin zone, not the boundary.',evidence:'<b>Evidence rule:</b> source records are claims, not unique people. No name-only merge. List removal is not proof of safety. A Nepal Police found record is shown as <b>LOCATED</b>, not automatically safe.',search:'Search person, district, municipality, locality, nationality, occupation, employer, vehicle…',allStatus:'All statuses',allDistrict:'All districts / locations',allSources:'All sources',bodies:'Include unidentified-body records',csv:'Export visible source records CSV',bodyWarning:'<b>Unidentified-body review mode:</b> separate recovery records requiring controlled human reconciliation.',coverage:'National source coverage',empty:'No loaded source record matches. This means UNKNOWN, not absent from the disaster.',architecture:'National incident → event zones → immutable source records → identity review → append-only status history.',sourceRecords:'Source records',visible:'Visible',missing:'Missing',located:'Located',safe:'Safe/rescued',injured:'Injured',death:'Death-source',bodiesStat:'Unidentified bodies',identityReview:'IDENTITY REVIEW',age:'age',openSource:'Open source record',original:'Original Nepali source text',recovery:'Recovery',estimatedAge:'estimated age'},ne:{title:'नेपाल २६ अगस्ट विपद् व्यक्ति समाधान डेस्क',subtitle:'राष्ट्रिय प्रभावित-व्यक्ति मिलान · भोटेकोशी/रसुवा उद्गम क्षेत्र तथा तलतिर/अन्तर-जिल्ला प्रभाव',scope:'<b>राष्ट्रिय दायरा:</b> २६ अगस्ट २०२६ को नेपाल विपद्सँग सम्बन्धित उपलब्ध प्रत्येक प्रभावित-व्यक्ति स्रोत अभिलेख समेटिन्छ।',evidence:'<b>प्रमाण नियम:</b> स्रोत अभिलेख दाबी हुन्, स्वतन्त्र व्यक्ति पहिचान होइनन्। नाम मात्रका आधारमा मिलान हुँदैन।',search:'व्यक्ति, जिल्ला, पालिका, स्थान, राष्ट्रियता, पेशा, रोजगारदाता, सवारी खोज्नुहोस्…',allStatus:'सबै अवस्था',allDistrict:'सबै जिल्ला / स्थान',allSources:'सबै स्रोत',bodies:'अपरिचित शव अभिलेख समावेश गर्नुहोस्',csv:'देखिएका स्रोत अभिलेख CSV निकाल्नुहोस्',bodyWarning:'<b>अपरिचित शव समीक्षा मोड:</b> छुट्टै बरामद अभिलेख हुन्।',coverage:'राष्ट्रिय स्रोत कभरेज',empty:'लोड भएका स्रोत अभिलेखमा मेल भेटिएन।',architecture:'राष्ट्रिय घटना → घटना क्षेत्र → स्रोत अभिलेख → पहिचान समीक्षा → अवस्था इतिहास।',sourceRecords:'स्रोत अभिलेख',visible:'देखिएका',missing:'बेपत्ता',located:'फेला/सम्पर्क',safe:'सुरक्षित/उद्धार',injured:'घाइते',death:'मृत्यु-स्रोत',bodiesStat:'अपरिचित शव',identityReview:'पहिचान समीक्षा',age:'उमेर',openSource:'स्रोत अभिलेख खोल्नुहोस्',original:'मूल नेपाली स्रोत पाठ',recovery:'बरामद',estimatedAge:'अनुमानित उमेर'}};function tr(k){return T[language][k]||T.en[k]||k}const repl=[['हराएको व्यक्तिको ठेगाना','Missing person address'],['हराएको ठेगाना','Missing location'],['हराएको मिति','Missing date'],['सम्भावित स्थान','Possible location'],['भेटिएको ठाउँ','Found location'],['भेटिएको मिति','Found date'],['हाल शव राखेको स्थान','Current body storage location'],['उपमहानगरपालिका','Sub-Metropolitan City'],['महानगरपालिका','Metropolitan City'],['गाउँपालिका','Rural Municipality'],['नगरपालिका','Municipality'],['प्रदेश','Province'],['जिल्ला','District'],['वडा','Ward'],['पुरुष','Male'],['महिला','Female'],['विवरण हेर्नुहोस्','View source details'],['बेपत्ता','Missing'],['घाइते','Injured'],['उद्धार','Rescued'],['मृत','Deceased']];const digits={'०':'0','१':'1','२':'2','३':'3','४':'4','५':'5','६':'6','७':'7','८':'8','९':'9'};const map={'अ':'a','आ':'aa','इ':'i','ई':'i','उ':'u','ऊ':'u','ऋ':'ri','ए':'e','ऐ':'ai','ओ':'o','औ':'au','क':'k','ख':'kh','ग':'g','घ':'gh','ङ':'ng','च':'ch','छ':'chh','ज':'j','झ':'jh','ञ':'ny','ट':'t','ठ':'th','ड':'d','ढ':'dh','ण':'n','त':'t','थ':'th','द':'d','ध':'dh','न':'n','प':'p','फ':'ph','ब':'b','भ':'bh','म':'m','य':'y','र':'r','ल':'l','व':'v','श':'sh','ष':'sh','स':'s','ह':'h','ा':'a','ि':'i','ी':'i','ु':'u','ू':'u','ृ':'ri','े':'e','ै':'ai','ो':'o','ौ':'au','ं':'n','ँ':'n','ः':'h','्':''};function latin(s){s=String(s||'');for(const [a,b] of repl)s=s.split(a).join(b);let out='';for(const ch of s){if(digits[ch])out+=digits[ch];else if(map[ch]!=null)out+=map[ch];else out+=ch}return out.replace(/\s+/g,' ').replace(/\s*,\s*/g,', ').replace(/\s*:\s*/g,': ').trim()}function firstLatin(...vals){for(const v of vals){if(v&&String(v).trim()&&!/[\u0900-\u097F]/.test(String(v)))return String(v)}for(const v of vals){if(v&&String(v).trim())return latin(v)}return ''}function nameFor(r){return language==='en'?firstLatin(r.name_en,r.romanized_name,r.english_name,r.name):String(r.name_ne||r.original_name||r.name||'')}function textFor(r,key){const en=r[key+'_en']||r['english_'+key];const raw=r[key]||'';return language==='en'?firstLatin(en,raw):String(r[key+'_ne']||raw)}function applyLanguage(){document.documentElement.lang=language==='ne'?'ne':'en';$('title').textContent=tr('title');$('subtitle').textContent=tr('subtitle');$('scope').innerHTML=tr('scope');$('evidence').innerHTML=tr('evidence');$('q').placeholder=tr('search');$('st').options[0].textContent=tr('allStatus');$('district').options[0].textContent=tr('allDistrict');$('src').options[0].textContent=tr('allSources');$('bodiesLabel').textContent=tr('bodies');$('csv').textContent=tr('csv');$('bodyWarning').innerHTML=tr('bodyWarning');$('coverageTitle').textContent=tr('coverage');$('empty').textContent=tr('empty');$('architecture').textContent=tr('architecture');$('langEn').classList.toggle('active',language==='en');$('langNe').classList.toggle('active',language==='ne');renderCoverage();render()}function duplicateNames(){const m={};people.forEach(r=>{const k=norm(nameFor(r));if(k)(m[k]??=[]).push(r)});return new Set(Object.entries(m).filter(([,v])=>v.length>1).map(([k])=>k))}function render(){rows=$('bodies').checked?[...people,...bodies]:people;const q=norm($('q').value),st=$('st').value,src=$('src').value,dist=norm($('district').value),dups=duplicateNames();const hit=rows.filter(r=>{const search=norm([r.name,nameFor(r),r.location,textFor(r,'location'),r.detail,textFor(r,'detail'),r.id,r.found,textFor(r,'found'),r.district,textFor(r,'district'),r.municipality,textFor(r,'municipality'),r.nationality,r.occupation,r.employer,r.vehicle].join(' '));const geo=norm([r.district,textFor(r,'district'),r.location,textFor(r,'location'),r.found,textFor(r,'found')].join(' '));return(!q||search.includes(q))&&(!st||r.status===st)&&(!src||r.source===src)&&(!dist||geo.includes(dist))});const c={};rows.forEach(r=>c[r.status]=(c[r.status]||0)+1);$('stats').innerHTML=`<div class=stat>${tr('sourceRecords')} ${rows.length}</div><div class=stat>${tr('visible')} ${hit.length}</div><div class=stat>${tr('missing')} ${c.MISSING||0}</div><div class=stat>${tr('located')} ${c.LOCATED||0}</div><div class=stat>${tr('safe')} ${(c.FOUND_SAFE||0)+(c.RESCUED||0)}</div><div class=stat>${tr('injured')} ${c.FOUND_INJURED||0}</div><div class=stat>${tr('death')} ${c.FOUND_DEAD||0}</div>${$('bodies').checked?`<div class=stat>${tr('bodiesStat')} ${c.UNIDENTIFIED_BODY||0}</div>`:''}`;$('records').innerHTML=hit.map(r=>{const nm=nameFor(r)|| (language==='en'?'Unidentified person':'अपरिचित व्यक्ति');const k=norm(nm),dup=r.status!=='UNIDENTIFIED_BODY'&&dups.has(k)?`<span class=pill>${tr('identityReview')}</span>`:'';const geo=[textFor(r,'district'),textFor(r,'municipality'),textFor(r,'location')].filter(Boolean).filter((x,i,a)=>a.indexOf(x)===i).join(' · ');const detail=textFor(r,'detail');const found=textFor(r,'found');const rawNepali=[r.name,r.location,r.detail,r.found].filter(v=>/[\u0900-\u097F]/.test(String(v||''))).join(' · ');const bodyExtra=r.status==='UNIDENTIFIED_BODY'?`<p><b>${tr('recovery')}:</b> ${esc(found||textFor(r,'location')||'unknown')}${r.estimated_age!=null?' · '+tr('estimatedAge')+' '+esc(r.estimated_age):''}</p>`:'';return `<article class="card ${esc(r.status)}"><span class=pill>${esc(r.id||'')}</span>${r.source_url?`<a class="pill sourcepill" target="_blank" rel="noopener" href="${esc(r.source_url)}">${esc(r.source||'SOURCE')}</a>`:`<span class=pill>${esc(r.source||'SOURCE')}</span>`}${dup}<h2>${esc(nm)}</h2><p><b>${esc(r.status||'UNKNOWN')}</b>${r.age!=null?' · '+tr('age')+' '+esc(r.age):''}${r.sex?' · '+esc(language==='en'?firstLatin(r.sex_en,r.sex):r.sex):''}</p>${geo?`<p>${esc(geo)}</p>`:''}${bodyExtra}${detail?`<p>${esc(detail)}</p>`:''}${language==='en'&&rawNepali?`<details class=original><summary>${tr('original')}</summary><div>${esc(rawNepali)}</div></details>`:''}${r.source_url?`<p><a class="source-link" target="_blank" rel="noopener" href="${esc(r.source_url)}">↗ ${tr('openSource')}</a></p>`:''}</article>`}).join('');$('empty').style.display=hit.length?'none':'block';$('bodyWarning').style.display=$('bodies').checked?'block':'none';window.visibleRows=hit}function renderCoverage(){$('coverage').innerHTML=coverage.map(s=>`<div><b>${esc(language==='en'?firstLatin(s.source_en,s.source):s.source)}</b> — ${esc(language==='en'?firstLatin(s.coverage_en,s.coverage):s.coverage||'')} / ${esc(s.status||'')}<br><span class=meta>${esc(language==='en'?firstLatin(s.notes_en,s.notes):s.notes||'')}</span>${s.url?` · <a target="_blank" rel="noopener" href="${esc(s.url)}">${tr('openSource')}</a>`:''}</div>`).join('')}function exportCSV(){const h=['id','source','name','age','sex','status','district','municipality','location','detail','nationality','occupation','employer','vehicle','found','estimated_age','source_url'];const q=x=>'"'+String(x??'').replace(/"/g,'""')+'"';const out=[h.join(','),...window.visibleRows.map(r=>h.map(k=>q(r[k])).join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'text/csv'}));a.download='nepal-26-aug-disaster-source-records.csv';a.click();URL.revokeObjectURL(a.href)}Promise.all([fetch('data/records.json?'+Date.now()).then(r=>r.json()),fetch('data/unidentified-bodies.json?'+Date.now()).then(r=>r.json()),fetch('data/source-coverage.json?'+Date.now()).then(r=>r.json())]).then(([d,b,c])=>{people=d.records||[];bodies=b.records||[];coverage=c.sources||[];[...new Set([...people,...bodies].map(r=>r.source).filter(Boolean))].sort().forEach(s=>$('src').insertAdjacentHTML('beforeend',`<option value="${esc(s)}">${esc(s)}</option>`));[...new Set([...people,...bodies].flatMap(r=>[r.district,r.location]).filter(Boolean).map(x=>language==='en'?firstLatin(x):String(x)))].sort().forEach(x=>$('district').insertAdjacentHTML('beforeend',`<option value="${esc(x)}">${esc(x)}</option>`));applyLanguage()}).catch(e=>{$('records').innerHTML='<div class=warn>Dataset load failed. Reload the page.</div>'});$('langEn').onclick=()=>{language='en';applyLanguage()};$('langNe').onclick=()=>{language='ne';applyLanguage()};$('q').oninput=render;['st','src','district','bodies'].forEach(x=>$(x).onchange=render);$('csv').onclick=exportCSV;applyLanguage();</script></body></html>
