<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nepal 26 Aug Disaster Resolution Desk</title><style>*{box-sizing:border-box}body{font-family:system-ui,sans-serif;margin:0;background:#edf0f2;color:#17202a}header{background:#13202c;color:#fff;padding:17px}header .wrap,main{max-width:1150px;margin:auto}.headrow{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.lang{display:flex;gap:6px;flex-shrink:0}.lang button{border:1px solid #82909d;background:#fff;color:#17202a;border-radius:5px;padding:8px 10px;font-weight:700}.lang button.active{background:#f0b323;border-color:#f0b323}h1{margin:0;font-size:24px}.sub{margin:4px 0 0;color:#d7dee5}.banner,.warn,.danger{margin:12px 0;padding:12px;border-left:5px solid}.banner{border-color:#006d9c;background:#e2f4fb}.warn{border-color:#a96b00;background:#fff2c6}.danger{border-color:#8b0000;background:#fdeaea}.controls{position:sticky;top:0;background:#fff;padding:10px;margin:12px 0;border-radius:8px;z-index:3;box-shadow:0 2px 8px #0001}.controls input,.controls select,.controls button{width:100%;padding:11px;margin:3px 0;font-size:15px;border:1px solid #b7bec5;border-radius:5px}.controls>button{background:#17202a;color:white}.toggle{display:flex;align-items:center;gap:8px;padding:8px 2px;font-size:14px}.toggle input{width:auto}.stats{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.stat{background:white;padding:9px 11px;border-radius:6px;font-weight:700}.card{background:#fff;margin:8px 0;padding:14px;border-radius:8px;border-left:5px solid #74808a}.MISSING{border-color:#a61b1b}.FOUND_SAFE,.RESCUED,.LOCATED{border-color:#22733f}.FOUND_INJURED{border-color:#b26a00}.FOUND_DEAD{border-color:#252525}.UNKNOWN{border-color:#7b4a8d}.UNIDENTIFIED_BODY{border-color:#111;background:#f7f7f7}.pill{font-size:11px;background:#eef1f3;border-radius:12px;padding:3px 7px;margin-right:4px;display:inline-block}.sourcepill{background:#e4f1fb;color:#005c9c;text-decoration:underline;font-weight:700}.source-link{display:inline-block;margin-top:4px;padding:8px 10px;border:1px solid #90b8d2;border-radius:5px;background:#f4fbff;font-weight:700;text-decoration:none}.meta{font-size:13px;color:#5c6670}.empty{display:none;background:white;padding:18px}.sourcebox{background:white;padding:12px;margin-top:18px;border-radius:8px}.sourcebox div{padding:10px 0;border-bottom:1px solid #eee}.sourcebox div:last-child{border:0}.coverage-link{font-weight:700}a{color:#005c9c}main{padding:0 12px 35px}.small{font-size:12px;color:#616a72}@media(max-width:640px){.headrow{display:block}.lang{margin-top:12px}.lang button{flex:1}}</style></head><body><header><div class="wrap"><div class="headrow"><div><h1 id="title">Nepal 26 August Disaster Resolution Desk</h1><p class="sub" id="subtitle">National affected-person reconciliation · Bhote Koshi/Rasuwa origin zone and downstream/cross-district consequences</p></div><div class="lang" aria-label="Language"><button id="langEn" class="active">English</button><button id="langNe">नेपाली</button></div></div></div></header><main><div class="banner" id="scope"></div><div class="warn" id="evidence"></div><div class="controls"><input id="q"><select id="st"><option value=""></option><option value="MISSING">MISSING</option><option value="LOCATED">LOCATED</option><option value="FOUND_SAFE">FOUND_SAFE</option><option value="RESCUED">RESCUED</option><option value="FOUND_INJURED">FOUND_INJURED</option><option value="FOUND_DEAD">FOUND_DEAD</option><option value="UNKNOWN">UNKNOWN</option><option value="UNIDENTIFIED_BODY">UNIDENTIFIED_BODY</option></select><select id="district"><option value=""></option></select><select id="src"><option value=""></option></select><label class="toggle"><input type="checkbox" id="bodies"><span id="bodiesLabel"></span></label><button id="csv"></button></div><div id="bodyWarning" class="danger" style="display:none"></div><div class="stats" id="stats"></div><section id="records"></section><div id="empty" class="empty"></div><section class="sourcebox"><h2 id="coverageTitle"></h2><div id="coverage"></div></section><p class="small" id="architecture"></p></main><script>let people=[],bodies=[],coverage=[],rows=[],language='en';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const norm=s=>String(s||'').toLowerCase().normalize('NFKD').replace(/[^\p{L}\p{N}]+/gu,' ').trim();const T={en:{title:'Nepal 26 August Disaster Resolution Desk',subtitle:'National affected-person reconciliation · Bhote Koshi/Rasuwa origin zone and downstream/cross-district consequences',scope:'<b>National scope:</b> every available affected-person source record connected to the 26 Aug 2026 Nepal disaster, regardless of home district, recovery district, nationality or reporting authority. Rasuwa is an event/origin zone, not the boundary.',evidence:'<b>Evidence rule:</b> source records are claims, not unique people. No name-only merge. List removal is not proof of safety. A Nepal Police found record is shown as <b>LOCATED</b>, not automatically safe. Death or identity is never inferred from age, sex or geography alone.',search:'Search person, district, municipality, locality, nationality, occupation, employer, vehicle…',allStatus:'All statuses',allDistrict:'All districts / locations',allSources:'All sources',bodies:'Include unidentified-body records',csv:'Export visible source records CSV',bodyWarning:'<b>Unidentified-body review mode:</b> these are separate recovery records requiring controlled human reconciliation. No automatic missing-person match is performed.',coverage:'National source coverage',loading:'Loading…',empty:'No loaded source record matches. This means UNKNOWN, not absent from the disaster.',architecture:'Architecture: national incident → event zones → immutable source snapshots → affected-person reports → identity relationships → reviewed person clusters → append-only status events.',sourceRecords:'Source records',visible:'Visible',missing:'Missing',located:'Located',safe:'Safe/rescued',injured:'Injured',death:'Death-source',bodiesStat:'Unidentified bodies',identityReview:'IDENTITY REVIEW',recovery:'Recovery',unknown:'unknown',estimatedAge:'estimated age',age:'age',openSource:'Open source record',source:'source'},ne:{title:'नेपाल २६ अगस्ट विपद् व्यक्ति समाधान डेस्क',subtitle:'राष्ट्रिय प्रभावित-व्यक्ति मिलान · भोटेकोशी/रसुवा उद्गम क्षेत्र तथा तलतिर/अन्तर-जिल्ला प्रभाव',scope:'<b>राष्ट्रिय दायरा:</b> २६ अगस्ट २०२६ को नेपाल विपद्सँग सम्बन्धित उपलब्ध प्रत्येक प्रभावित-व्यक्ति स्रोत अभिलेख समेटिन्छ—घर जिल्ला, भेटिएको जिल्ला, राष्ट्रियता वा रिपोर्ट गर्ने निकाय जे भए पनि। रसुवा घटना/उद्गम क्षेत्र हो, सीमा होइन।',evidence:'<b>प्रमाण नियम:</b> स्रोत अभिलेख दाबी हुन्, स्वतन्त्र व्यक्ति पहिचान होइनन्। नाम मात्रका आधारमा मिलान हुँदैन। सूचीबाट नाम हट्नु सुरक्षित भएको प्रमाण होइन। नेपाल प्रहरीको found अभिलेखलाई <b>LOCATED</b> देखाइन्छ, स्वतः सुरक्षित मानिँदैन। उमेर, लिङ्ग वा भूगोल मात्रका आधारमा मृत्यु वा पहिचान निष्कर्ष निकालिँदैन।',search:'व्यक्ति, जिल्ला, पालिका, स्थान, राष्ट्रियता, पेशा, रोजगारदाता, सवारी खोज्नुहोस्…',allStatus:'सबै अवस्था',allDistrict:'सबै जिल्ला / स्थान',allSources:'सबै स्रोत',bodies:'अपरिचित शव अभिलेख समावेश गर्नुहोस्',csv:'देखिएका स्रोत अभिलेख CSV निकाल्नुहोस्',bodyWarning:'<b>अपरिचित शव समीक्षा मोड:</b> यी छुट्टै बरामद अभिलेख हुन् र नियन्त्रित मानवीय मिलान आवश्यक हुन्छ। कुनै स्वतः बेपत्ता-व्यक्ति मिलान गरिँदैन।',coverage:'राष्ट्रिय स्रोत कभरेज',loading:'लोड हुँदैछ…',empty:'लोड भएका स्रोत अभिलेखमा मेल भेटिएन। यसको अर्थ UNKNOWN हो, विपद्बाट अनुपस्थित भन्ने होइन।',architecture:'संरचना: राष्ट्रिय घटना → घटना क्षेत्र → अपरिवर्तनीय स्रोत स्न्यापसट → प्रभावित-व्यक्ति रिपोर्ट → पहिचान सम्बन्ध → समीक्षा गरिएको व्यक्ति क्लस्टर → append-only अवस्था घटना।',sourceRecords:'स्रोत अभिलेख',visible:'देखिएका',missing:'बेपत्ता',located:'फेला/सम्पर्क',safe:'सुरक्षित/उद्धार',injured:'घाइते',death:'मृत्यु-स्रोत',bodiesStat:'अपरिचित शव',identityReview:'पहिचान समीक्षा',recovery:'बरामद',unknown:'अज्ञात',estimatedAge:'अनुमानित उमेर',age:'उमेर',openSource:'स्रोत अभिलेख खोल्नुहोस्',source:'स्रोत'}};function tr(k){return T[language][k]||T.en[k]||k}function applyLanguage(){document.documentElement.lang=language==='ne'?'ne':'en';$('title').textContent=tr('title');$('subtitle').textContent=tr('subtitle');$('scope').innerHTML=tr('scope');$('evidence').innerHTML=tr('evidence');$('q').placeholder=tr('search');$('st').options[0].textContent=tr('allStatus');$('district').options[0].textContent=tr('allDistrict');$('src').options[0].textContent=tr('allSources');$('bodiesLabel').textContent=tr('bodies');$('csv').textContent=tr('csv');$('bodyWarning').innerHTML=tr('bodyWarning');$('coverageTitle').textContent=tr('coverage');$('empty').textContent=tr('empty');$('architecture').textContent=tr('architecture');$('langEn').classList.toggle('active',language==='en');$('langNe').classList.toggle('active',language==='ne');renderCoverage();render()}function duplicateNames(){const m={};people.forEach(r=>{const k=norm((r.name||'').split('/')[0]);if(!k)return;(m[k]??=[]).push(r)});return new Set(Object.entries(m).filter(([,v])=>v.length>1).map(([k])=>k))}function render(){rows=$('bodies').checked?[...people,...bodies]:people;const q=norm($('q').value),st=$('st').value,src=$('src').value,dist=norm($('district').value),dups=duplicateNames();const hit=rows.filter(r=>(!q||norm([r.name,r.location,r.detail,r.id,r.found,r.estimated_age,r.district,r.municipality,r.nationality,r.occupation,r.employer,r.vehicle].join(' ')).includes(q))&&(!st||r.status===st)&&(!src||r.source===src)&&(!dist||norm([r.district,r.location,r.found].join(' ')).includes(dist)));const c={};rows.forEach(r=>c[r.status]=(c[r.status]||0)+1);$('stats').innerHTML=`<div class=stat>${tr('sourceRecords')} ${rows.length}</div><div class=stat>${tr('visible')} ${hit.length}</div><div class=stat>${tr('missing')} ${c.MISSING||0}</div><div class=stat>${tr('located')} ${c.LOCATED||0}</div><div class=stat>${tr('safe')} ${(c.FOUND_SAFE||0)+(c.RESCUED||0)}</div><div class=stat>${tr('injured')} ${c.FOUND_INJURED||0}</div><div class=stat>${tr('death')} ${c.FOUND_DEAD||0}</div>${$('bodies').checked?`<div class=stat>${tr('bodiesStat')} ${c.UNIDENTIFIED_BODY||0}</div>`:''}`;$('records').innerHTML=hit.map(r=>{const k=norm((r.name||'').split('/')[0]),dup=r.status!=='UNIDENTIFIED_BODY'&&dups.has(k)?`<span class=pill>${tr('identityReview')}</span>`:'';const geo=[r.district,r.municipality,r.location].filter(Boolean).filter((x,i,a)=>a.indexOf(x)===i).join(' · ');const extra=r.status==='UNIDENTIFIED_BODY'?`<p><b>${tr('recovery')}:</b> ${esc(r.found||r.location||tr('unknown'))}${r.estimated_age!=null?' · '+tr('estimatedAge')+' '+esc(r.estimated_age):''}</p>`:'';const sourcePill=r.source_url?`<a class="pill sourcepill" target=_blank rel=noopener href="${esc(r.source_url)}">${esc(r.source)}</a>`:`<span class=pill>${esc(r.source)}</span>`;return `<article class="card ${esc(r.status)}"><span class=pill>${esc(r.id)}</span>${sourcePill}${dup}<h2>${esc(r.name||tr('unknown'))}</h2><p><b>${esc(r.status)}</b>${r.age!=null?' · '+tr('age')+' '+esc(r.age):''}${r.sex?' · '+esc(r.sex):''}</p>${geo?`<p>${esc(geo)}</p>`:''}${extra}<p>${esc(r.detail||'')}</p>${r.source_url?`<p class=meta><a class=source-link target=_blank rel=noopener href="${esc(r.source_url)}">↗ ${tr('openSource')}</a></p>`:''}</article>`}).join('');$('empty').style.display=hit.length?'none':'block';$('bodyWarning').style.display=$('bodies').checked?'block':'none';window.visibleRows=hit}function renderCoverage(){$('coverage').innerHTML=coverage.length?coverage.map(s=>`<div><b>${esc(s.source)}</b> — ${esc(s.coverage)} / ${esc(s.status)}<br><span class=meta>${esc(s.notes||'')}</span>${s.url?` · <a class=coverage-link target=_blank rel=noopener href="${esc(s.url)}">↗ ${tr('source')}</a>`:''}</div>`).join(''):tr('loading')}function exportCSV(){const h=['id','source','name','age','sex','status','district','municipality','location','detail','nationality','occupation','employer','vehicle','found','estimated_age','source_url'];const q=x=>'"'+String(x??'').replace(/"/g,'""')+'"';const out=[h.join(','),...window.visibleRows.map(r=>h.map(k=>q(r[k])).join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'text/csv'}));a.download='nepal-26-aug-disaster-source-records.csv';a.click();URL.revokeObjectURL(a.href)}$('langEn').onclick=()=>{language='en';applyLanguage()};$('langNe').onclick=()=>{language='ne';applyLanguage()};Promise.all([fetch('data/records.json').then(r=>r.json()),fetch('data/unidentified-bodies.json').then(r=>r.json()),fetch('data/source-coverage.json').then(r=>r.json())]).then(([d,b,c])=>{people=d.records||[];bodies=b.records||[];coverage=c.sources||[];[...new Set([...people,...bodies].map(r=>r.source).filter(Boolean))].sort().forEach(s=>$('src').insertAdjacentHTML('beforeend',`<option>${esc(s)}</option>`));[...new Set([...people,...bodies].flatMap(r=>[r.district,r.found&&String(r.found).split(',')[0]]).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b))).forEach(x=>$('district').insertAdjacentHTML('beforeend',`<option>${esc(x)}</option>`));applyLanguage()}).catch(()=>{$('records').innerHTML='<div class=warn>Dataset load failed. Reload the page.</div>'});['q'].forEach(x=>$(x).oninput=render);['st','src','district','bodies'].forEach(x=>$(x).onchange=render);$('csv').onclick=exportCSV;applyLanguage();</script></body></html>
