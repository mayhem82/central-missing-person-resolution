<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nepal 26 August Disaster Resolution Desk</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,sans-serif;margin:0;background:#edf0f2;color:#17202a}header{background:#13202c;color:#fff;padding:16px}header .wrap,main{max-width:1150px;margin:auto}.headrow{display:flex;justify-content:space-between;gap:12px}.lang{display:flex;gap:6px}.lang button{padding:9px 12px;border:1px solid #82909d;background:#fff;border-radius:5px;font-weight:700}.lang button.active{background:#f0b323;border-color:#f0b323}h1{margin:0;font-size:24px}.sub{margin:4px 0;color:#d7dee5}.banner,.warn,.danger{margin:12px 0;padding:12px;border-left:5px solid}.banner{border-color:#006d9c;background:#e2f4fb}.warn{border-color:#a96b00;background:#fff2c6}.danger{border-color:#8b0000;background:#fdeaea}.controls{position:sticky;top:0;background:#fff;padding:10px;margin:12px 0;border-radius:8px;z-index:3;box-shadow:0 2px 8px #0001}.controls input,.controls select,.controls>button{width:100%;padding:11px;margin:3px 0;font-size:15px;border:1px solid #b7bec5;border-radius:5px}.controls>button{background:#17202a;color:#fff}.toggle{display:flex;gap:8px;align-items:center;padding:8px 2px}.toggle input{width:auto}.stats{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.stat{background:#fff;padding:9px 11px;border-radius:6px;font-weight:700}.cohortbox,.sourcebox{background:#fff;padding:12px;margin:12px 0;border-radius:8px}.cohortbox h2,.sourcebox h2{margin-top:0}.cohortcard{padding:10px 0;border-bottom:1px solid #eee}.cohortcard:last-child{border:0}.card{background:#fff;margin:8px 0;padding:14px;border-radius:8px;border-left:5px solid #74808a}.MISSING{border-color:#a61b1b}.FOUND_SAFE,.RESCUED,.LOCATED{border-color:#22733f}.FOUND_INJURED{border-color:#b26a00}.FOUND_DEAD{border-color:#252525}.UNKNOWN{border-color:#7b4a8d}.UNIDENTIFIED_BODY{border-color:#111}.pill{font-size:11px;background:#eef1f3;border-radius:12px;padding:3px 7px;margin-right:4px;display:inline-block}.source-link{display:inline-block;margin-top:6px;padding:8px 10px;border:1px solid #90b8d2;border-radius:5px;background:#f4fbff;font-weight:700;text-decoration:none}.meta{font-size:13px;color:#5c6670}.empty{display:none;background:#fff;padding:18px}.small{font-size:12px;color:#616a72}a{color:#005c9c}main{padding:0 12px 35px}@media(max-width:640px){.headrow{display:block}.lang{margin-top:12px}.lang button{flex:1}}
</style>
</head>
<body>
<header><div class="wrap"><div class="headrow"><div><h1 id="title"></h1><p class="sub" id="subtitle"></p></div><div class="lang"><button id="langEn" class="active">English</button><button id="langNe">नेपाली</button></div></div></div></header>
<main>
<div class="banner" id="scope"></div>
<div class="warn" id="evidence"></div>
<div class="controls">
<input id="q">
<select id="cohort"><option value=""></option></select>
<select id="st"><option value=""></option><option>MISSING</option><option>LOCATED</option><option>FOUND_SAFE</option><option>RESCUED</option><option>FOUND_INJURED</option><option>FOUND_DEAD</option><option>UNKNOWN</option><option>UNIDENTIFIED_BODY</option></select>
<select id="district"><option value=""></option></select>
<select id="src"><option value=""></option></select>
<label class="toggle"><input type="checkbox" id="bodies"><span id="bodiesLabel"></span></label>
<button id="csv"></button>
</div>
<div id="bodyWarning" class="danger" style="display:none"></div>
<div class="stats" id="stats"></div>
<section class="cohortbox"><h2 id="cohortTitle"></h2><div id="cohortSummary"></div></section>
<section id="records"></section>
<div id="empty" class="empty"></div>
<section class="sourcebox"><h2 id="coverageTitle"></h2><div id="coverage"></div></section>
<p class="small"><a href="reuse.html">Departments / reuse this deployment</a></p>
<p class="small" id="architecture"></p>
</main>
<script>
let people=[],bodies=[],coverage=[],cohortIndex={},rows=[],language='en';
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const norm=s=>String(s||'').toLowerCase().normalize('NFKD').replace(/[^\p{L}\p{N}]+/gu,' ').trim();
const T={en:{title:'Nepal 26 August Disaster Resolution Desk',subtitle:'National and international affected-person reconciliation',scope:'<b>National incident scope:</b> affected-person records are reconciled across Nepal government sources, nationality cohorts, travel groups and recovery records.',evidence:'<b>Evidence rule:</b> cohort totals are source claims, not unique-person totals. Overlapping nationality, operator and location cohorts are never summed automatically.',search:'Search person, district, nationality, operator, locality, employer, vehicle…',allCohorts:'All cohorts / nationalities / travel groups',allStatus:'All statuses',allDistrict:'All districts / locations',allSources:'All sources',bodies:'Include unidentified-body records',csv:'Export visible records CSV',bodyWarning:'<b>Unidentified-body review mode:</b> separate recovery records requiring controlled human reconciliation.',cohortTitle:'Selected cohort',coverage:'National source coverage',empty:'No loaded person-level source record matches this filter. This does not mean nobody is in that cohort.',architecture:'Source record → evidence event → identity claim → person cluster → append-only status history.'},ne:{title:'नेपाल २६ अगस्ट विपद् व्यक्ति समाधान डेस्क',subtitle:'राष्ट्रिय तथा अन्तर्राष्ट्रिय प्रभावित-व्यक्ति मिलान',scope:'<b>घटना दायरा:</b> नेपाल सरकारका स्रोत, राष्ट्रियता समूह, यात्रा समूह र बरामद अभिलेखहरूबीच मिलान।',evidence:'<b>प्रमाण नियम:</b> समूह संख्या स्रोत दाबी हुन्, स्वतन्त्र व्यक्ति संख्या होइनन्।',search:'व्यक्ति, जिल्ला, राष्ट्रियता, यात्रा समूह, स्थान खोज्नुहोस्…',allCohorts:'सबै समूह / राष्ट्रियता / यात्रा समूह',allStatus:'सबै अवस्था',allDistrict:'सबै जिल्ला / स्थान',allSources:'सबै स्रोत',bodies:'अपरिचित शव अभिलेख समावेश गर्नुहोस्',csv:'देखिएका अभिलेख CSV निकाल्नुहोस्',bodyWarning:'<b>अपरिचित शव समीक्षा मोड</b>',cohortTitle:'छानिएको समूह',coverage:'राष्ट्रिय स्रोत कभरेज',empty:'यो फिल्टरसँग मेल खाने व्यक्ति-स्तर अभिलेख भेटिएन।',architecture:'स्रोत अभिलेख → प्रमाण → पहिचान समीक्षा → व्यक्ति समूह → अवस्था इतिहास।'}};function tr(k){return T[language][k]||T.en[k]||k}
function applyLanguage(){$('title').innerHTML=tr('title');$('subtitle').textContent=tr('subtitle');$('scope').innerHTML=tr('scope');$('evidence').innerHTML=tr('evidence');$('q').placeholder=tr('search');$('cohort').options[0].textContent=tr('allCohorts');$('st').options[0].textContent=tr('allStatus');$('district').options[0].textContent=tr('allDistrict');$('src').options[0].textContent=tr('allSources');$('bodiesLabel').textContent=tr('bodies');$('csv').textContent=tr('csv');$('bodyWarning').innerHTML=tr('bodyWarning');$('cohortTitle').textContent=tr('cohortTitle');$('coverageTitle').textContent=tr('coverage');$('empty').textContent=tr('empty');$('architecture').textContent=tr('architecture');$('langEn').classList.toggle('active',language==='en');$('langNe').classList.toggle('active',language==='ne');renderCoverage();renderCohortSummary();render()}
function cohortDefs(){const out=[];for(const n of Object.keys(cohortIndex.nationality_claims||{}).sort())out.push({value:'nat:'+n,label:'Nationality — '+n,type:'nat',key:n});for(const o of (cohortIndex.operator_claims||[])){const k=o.operator||o.group||o.name;if(k&&!out.some(x=>x.value==='op:'+k))out.push({value:'op:'+k,label:'Travel group — '+k,type:'op',key:k})}return out}
function recordMatchesCohort(r,v){if(!v)return true;const [type,...rest]=v.split(':');const key=rest.join(':');const hay=norm([r.nationality,r.country,r.country_of_residence,r.australian_connection,r.group,r.operator,r.travel_group,r.detail].join(' '));return hay.includes(norm(key))}
function renderCohortSummary(){const v=$('cohort').value;if(!v){$('cohortSummary').innerHTML='<span class="meta">Choose a cohort above to view its source claims and matching person-level records.</span>';return}const [type,...rest]=v.split(':');const key=rest.join(':');let claims=[];if(type==='nat')claims=cohortIndex.nationality_claims?.[key]||[];else claims=(cohortIndex.operator_claims||[]).filter(x=>(x.operator||x.group||x.name)===key);$('cohortSummary').innerHTML=claims.length?claims.map(c=>`<div class="cohortcard"><b>${esc(key)}</b> · ${esc(c.status||'UNKNOWN')} · ${esc(c.count??c.count_approx??(c.count_min&&c.count_max?c.count_min+'–'+c.count_max:'count unspecified'))}${c.as_of?' · '+esc(c.as_of):''}${c.geography?' · '+esc(c.geography):''}<br><span class="meta">${esc(c.notes||'')}</span>${c.source_url?` · <a target="_blank" rel="noopener" href="${esc(c.source_url)}">source</a>`:''}</div>`).join(''):'<span class="meta">No aggregate source claim loaded for this cohort.</span>'}
function render(){rows=$('bodies').checked?[...people,...bodies]:people;const q=norm($('q').value),st=$('st').value,src=$('src').value,dist=norm($('district').value),co=$('cohort').value;const hit=rows.filter(r=>{const search=norm([r.name,r.name_en,r.location,r.detail,r.id,r.found,r.district,r.municipality,r.nationality,r.country,r.group,r.operator,r.travel_group,r.occupation,r.employer,r.vehicle].join(' '));const geo=norm([r.district,r.location,r.found].join(' '));return(!q||search.includes(q))&&(!st||r.status===st)&&(!src||r.source===src)&&(!dist||geo.includes(dist))&&recordMatchesCohort(r,co)});const c={};rows.forEach(r=>c[r.status]=(c[r.status]||0)+1);$('stats').innerHTML=`<div class=stat>Source records ${rows.length}</div><div class=stat>Visible ${hit.length}</div><div class=stat>Missing ${c.MISSING||0}</div><div class=stat>Located ${(c.LOCATED||0)+(c.FOUND_SAFE||0)+(c.RESCUED||0)}</div><div class=stat>Injured ${c.FOUND_INJURED||0}</div><div class=stat>Death-source ${c.FOUND_DEAD||0}</div>`;$('records').innerHTML=hit.map(r=>`<article class="card ${esc(r.status||'UNKNOWN')}"><span class=pill>${esc(r.id||'')}</span><span class=pill>${esc(r.source||'SOURCE')}</span><h2>${esc(r.name_en||r.name||'Unidentified person')}</h2><p><b>${esc(r.status||'UNKNOWN')}</b>${r.age!=null?' · age '+esc(r.age):''}</p>${r.nationality?`<p><b>Nationality:</b> ${esc(r.nationality)}</p>`:''}${r.group||r.operator||r.travel_group?`<p><b>Cohort:</b> ${esc(r.group||r.operator||r.travel_group)}</p>`:''}${r.location||r.district?`<p>${esc([r.district,r.municipality,r.location].filter(Boolean).join(' · '))}</p>`:''}${r.detail?`<p>${esc(r.detail)}</p>`:''}${r.source_url?`<a class=source-link target=_blank rel=noopener href="${esc(r.source_url)}">↗ Open source record</a>`:''}</article>`).join('');$('empty').style.display=hit.length?'none':'block';$('bodyWarning').style.display=$('bodies').checked?'block':'none';window.visibleRows=hit}
function renderCoverage(){$('coverage').innerHTML=(coverage||[]).map(s=>`<div><b>${esc(s.source||'')}</b> — ${esc(s.coverage||'')} / ${esc(s.status||'')}${s.url?` · <a target=_blank rel=noopener href="${esc(s.url)}">source</a>`:''}</div>`).join('')}
function exportCSV(){const h=['id','source','name','age','status','nationality','group','operator','district','municipality','location','detail','source_url'];const q=x=>'"'+String(x??'').replace(/"/g,'""')+'"';const out=[h.join(','),...window.visibleRows.map(r=>h.map(k=>q(r[k])).join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'text/csv'}));a.download='nepal-disaster-visible-records.csv';a.click();URL.revokeObjectURL(a.href)}
Promise.all([
fetch('data/records.json?'+Date.now()).then(r=>r.json()),
fetch('data/unidentified-bodies.json?'+Date.now()).then(r=>r.json()),
fetch('data/source-coverage.json?'+Date.now()).then(r=>r.json()),
fetch('data/cohort-index.json?'+Date.now()).then(r=>r.json())
]).then(([d,b,c,ci])=>{people=d.records||[];bodies=b.records||[];coverage=c.sources||[];cohortIndex=ci||{};cohortDefs().forEach(x=>$('cohort').insertAdjacentHTML('beforeend',`<option value="${esc(x.value)}">${esc(x.label)}</option>`));[...new Set([...people,...bodies].map(r=>r.source).filter(Boolean))].sort().forEach(s=>$('src').insertAdjacentHTML('beforeend',`<option>${esc(s)}</option>`));[...new Set([...people,...bodies].flatMap(r=>[r.district,r.location]).filter(Boolean))].sort().forEach(x=>$('district').insertAdjacentHTML('beforeend',`<option>${esc(x)}</option>`));applyLanguage()}).catch(e=>{$('records').innerHTML='<div class=warn>Dataset load failed. Reload the page.</div>'});
$('langEn').onclick=()=>{language='en';applyLanguage()};$('langNe').onclick=()=>{language='ne';applyLanguage()};$('q').oninput=render;['cohort','st','src','district','bodies'].forEach(x=>$(x).onchange=()=>{if(x==='cohort')renderCohortSummary();render()});$('csv').onclick=exportCSV;applyLanguage();
</script>
</body></html>
