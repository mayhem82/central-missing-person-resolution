name: Source change watch
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/snapshot_sources.js'
      - 'scripts/ingest_setu.js'
      - 'scripts/ingest_police.js'
      - 'scripts/ingest_additional_sources.js'
      - 'scripts/build_live_dataset.js'
      - 'scripts/reconcile_candidates.js'
      - 'scripts/assess_completeness.js'
      - 'data/source-manifest.json'
      - 'incidents/nepal-2026-08-26/**'
      - '.github/workflows/source-watch.yml'
  schedule:
    - cron: '*/10 * * * *'
permissions:
  contents: write
concurrency:
  group: nepal-source-watch
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Snapshot national authoritative sources
        run: node scripts/snapshot_sources.js
        continue-on-error: true
      - name: Parse NDRRMA Setu
        run: node scripts/ingest_setu.js
      - name: Parse Nepal Police datasets
        run: node scripts/ingest_police.js
        continue-on-error: true
      - name: Parse additional official source streams
        run: node scripts/ingest_additional_sources.js
        continue-on-error: true
      - name: Build unified national live dataset
        run: node scripts/build_live_dataset.js
      - name: Build deterministic reconciliation review queue
        run: node scripts/reconcile_candidates.js
      - name: Assess national incident completeness
        run: node scripts/assess_completeness.js
      - name: Validate evidence model
        run: npm run validate
      - name: Run tests
        run: npm test
      - name: Commit changed snapshots and normalized national data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/source-snapshots data/source-snapshot-state.json data/setu-latest.json data/setu-diff.json data/police-missing-latest.json data/police-found-latest.json data/police-bodies-latest.json data/opmcm-latest.json data/dao-rasuwa-latest.json data/dao-rasuwa-bhadra12-latest.json data/dao-makwanpur-bhadra13-latest.json data/dao-banke-latest.json data/dao-parsa-bhadra13-latest.json data/records.json data/unidentified-bodies.json data/reconciliation-candidates.json data/completeness.json
          if git diff --cached --quiet; then
            echo 'No source or normalized-data changes.'
          else
            git commit -m 'source-watch: refresh unified national Nepal disaster data'
            git push
          fi
