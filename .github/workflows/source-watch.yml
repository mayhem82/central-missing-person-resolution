name: Source change watch
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Snapshot authoritative sources
        run: node scripts/snapshot_sources.js
        continue-on-error: true
      - name: Commit changed snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/source-snapshots data/source-snapshot-state.json
          if git diff --cached --quiet; then
            echo 'No source changes.'
          else
            git commit -m 'source-watch: preserve authoritative source changes'
            git push
          fi
